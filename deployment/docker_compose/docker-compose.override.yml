x-networks: &network
  networks:
    - central-net
    - default

networks:
  central-net:
    external: true

services:
  relational_db:
    profiles: ["disabled"]

  cache:
    profiles: ["disabled"]

  api_server:
    <<: *network
    depends_on:
      relational_db:
        required: false
      cache:
        required: false
      opensearch:
        condition: service_started
      inference_model_server:
        condition: service_started
    volumes:
      - ../../backend:/app/backend

  background:
    <<: *network
    depends_on:
      relational_db:
        required: false
      cache:
        required: false
      opensearch:
        condition: service_started
      inference_model_server:
        condition: service_started
      indexing_model_server:
        condition: service_started

  opensearch:
    <<: *network
    volumes:
      - ${OPENSEARCH_DATA_DIR:-./../../data/opensearch}:/usr/share/opensearch/data

  minio:
    <<: *network
    volumes:
      - ${MINIO_DATA_DIR:-./../../data/minio}:/export

  inference_model_server:
    <<: *network
    volumes:
      - ../../model_server:/app/model_server

  web_server:
    <<: *network
    depends_on:
      api_server:
        condition: service_healthy
    build:
      context: ../../web
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_ENABLE_PAID_ENTERPRISE_EDITION_FEATURES=true
        - NEXT_PUBLIC_ENABLE_PAID_EE_FEATURES=true
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_ENABLE_PAID_ENTERPRISE_EDITION_FEATURES=true
      - NEXT_PUBLIC_ENABLE_PAID_EE_FEATURES=true
    volumes:
      - ../../web/src:/app/src
      - ../../web/public:/app/public
      - /app/node_modules

  searxng:
    <<: *network
    image: searxng/searxng:latest
    container_name: searxng
    ports:
      - "${SEARXNG_PORT:-8888}:8080"
    volumes:
      - ${SEARXNG_DATA_DIR:-./../../data/searxng}:/etc/searxng
    environment:
      - SEARXNG_BASE_URL=${SEARXNG_BASE_URL:-http://localhost:8888/}
    restart: unless-stopped
